name: Push

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC federation into the benasher-co-deploy role
      deployments: write # the production GitHub deployment record
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache Yarn Cache
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: ${{ runner.os }}-nm-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-nm-
      - name: Enable corepack
        run: corepack enable
      - name: Install deps
        run: corepack yarn install --immutable
      - name: Build
        run: corepack yarn build
      - name: Open production deployment
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id="$(node scripts/gh-deployment.mjs create \
            --environment production \
            --ref '${{ github.sha }}' \
            --production \
            --environment-url 'https://benasher.co/')"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Mark deployment in progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gh-deployment.mjs status --id '${{ steps.deployment.outputs.id }}' --state in_progress
      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::508021704277:role/benasher-co-deploy
          aws-region: us-west-2
      - name: Deploy
        env:
          AWS_CF_DISTRIBUTION_ID: E2FTU05IZTIYC9
        run: corepack yarn deploy
      - name: Mark deployment succeeded
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gh-deployment.mjs status --id '${{ steps.deployment.outputs.id }}' --state success --environment-url 'https://benasher.co/'
      - name: Mark deployment failed
        if: failure() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gh-deployment.mjs status --id '${{ steps.deployment.outputs.id }}' --state failure
