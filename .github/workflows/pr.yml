name: PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # one job, not two: the preview deploy needs nothing the build didn't
  # already produce (node_modules + dist/ in the workspace) — a separate
  # job paid a second runner, checkout, install, and an artifact round-trip
  # just to run a small sync script
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC federation into the benasher-co-previews role
      pull-requests: write # the spellcheck gate's + preview's PR comments
      deployments: write # the preview GitHub deployment record
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node + install deps
        uses: ./.github/actions/setup-deps
      - name: Lint
        run: corepack yarn lint && corepack yarn format:check
      - name: Spellcheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: corepack yarn spellcheck
      - name: build
        run: corepack yarn build
      # the deployment record is metadata; the preview is the product — a
      # record hiccup must not block the deploy, hence continue-on-error here
      # and the id guards on every later step
      - name: Open preview deployment
        id: deployment
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          id="$(node scripts/gh-deployment.mjs create \
            --environment previews \
            --ref '${{ github.event.pull_request.head.sha }}' \
            --transient \
            --payload '{"pr": ${{ github.event.pull_request.number }}}')"
          echo "id=$id" >> "$GITHUB_OUTPUT"
      - name: Mark deployment in progress
        if: steps.deployment.outputs.id != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gh-deployment.mjs status --id '${{ steps.deployment.outputs.id }}' --state in_progress
      - name: Assume the previews deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::508021704277:role/benasher-co-previews
          aws-region: us-west-2
      - name: Deploy preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }} # GITHUB_SHA is the merge ref in PR runs
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-preview.mjs deploy
      - name: Mark deployment succeeded
        if: success() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gh-deployment.mjs status --id '${{ steps.deployment.outputs.id }}' --state success --environment-url 'https://pr-${{ github.event.pull_request.number }}.previews.benasher.co/'
      - name: Mark deployment failed
        if: failure() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gh-deployment.mjs status --id '${{ steps.deployment.outputs.id }}' --state failure

  preview-cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC federation into the benasher-co-previews role
      pull-requests: write # the preview PR comment
      deployments: write # remove the PR's preview deployment records
    steps:
      # merged PRs: the merge commit (post-merge main content, has the
      # scripts); closed-but-unmerged PRs: the head sha (the branch may be
      # gone — checkout fetches the sha directly). Pinning main would break
      # closes before this feature merges: main lacks the scripts entirely.
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: '${{ github.event.pull_request.merge_commit_sha || github.event.pull_request.head.sha }}'
      - name: Setup Node + install deps
        uses: ./.github/actions/setup-deps
      - name: Assume the previews deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::508021704277:role/benasher-co-previews
          aws-region: us-west-2
      - name: Remove preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-preview.mjs remove
      - name: Remove preview deployment records
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gh-deployment.mjs cleanup --environment previews --pr '${{ github.event.pull_request.number }}'