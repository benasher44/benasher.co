name: PR

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # the spellcheck gate's PR comment
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Cache Yarn Cache
        uses: actions/cache@v6
        with:
          path: ~/.yarn/berry/cache
          key: ${{ runner.os }}-yarn-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarn-
      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: |
            node_modules
            .yarn/install-state.gz
          key: ${{ runner.os }}-nm-${{ hashFiles('yarn.lock') }}
          restore-keys: ${{ runner.os }}-nm-
      - name: Enable corepack
        run: corepack enable
      - name: Install deps
        run: corepack yarn install --immutable
      - name: Lint
        run: corepack yarn lint && corepack yarn format:check
      - name: Spellcheck
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: corepack yarn spellcheck
      - name: build
        run: corepack yarn build
      - name: Upload site build
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: dist
          retention-days: 1 # the preview job consumes it right away

  preview:
    needs: build
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC federation into the benasher-co-previews role
      pull-requests: write # the preview PR comment
      deployments: write # the preview GitHub deployment record
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Open preview deployment
        id: deployment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "id=$(node scripts/gh-deployment.mjs create \
            --environment previews \
            --ref '${{ github.event.pull_request.head.sha }}' \
            --transient \
            --environment-url 'https://pr-${{ github.event.pull_request.number }}.previews.benasher.co/')" >> "$GITHUB_OUTPUT"
      - name: Mark deployment in progress
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gh-deployment.mjs status --id '${{ steps.deployment.outputs.id }}' --state in_progress
      - name: Download site build
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: dist
      - name: Assume the previews deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::508021704277:role/benasher-co-previews
          aws-region: us-west-2
      - name: Deploy preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-preview.mjs deploy
      - name: Mark deployment succeeded
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gh-deployment.mjs status --id '${{ steps.deployment.outputs.id }}' --state success --environment-url 'https://pr-${{ github.event.pull_request.number }}.previews.benasher.co/'
      - name: Mark deployment failed
        if: failure() && steps.deployment.outputs.id != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gh-deployment.mjs status --id '${{ steps.deployment.outputs.id }}' --state failure

  preview-cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC federation into the benasher-co-previews role
      pull-requests: write # the preview PR comment
      deployments: write # mark the preview deployment inactive
    steps:
      # main, not the merge ref: the PR head may already be deleted post-merge,
      # and remove only needs PR_NUMBER + the script (a merged PR runs main's
      # copy, which is the contract from here on)
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Assume the previews deploy role
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::508021704277:role/benasher-co-previews
          aws-region: us-west-2
      - name: Remove preview
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/deploy-preview.mjs remove
      - name: Mark preview deployment inactive
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/gh-deployment.mjs deactivate --environment previews --ref '${{ github.event.pull_request.head.sha }}'
