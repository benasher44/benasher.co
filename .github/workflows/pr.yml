name: PR

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Enable corepack
        run: corepack enable
      - name: Install deps
        run: corepack yarn install --immutable
      - name: Lint
        run: corepack yarn lint && corepack yarn format:check
      - name: Danger
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: corepack yarn danger ci
      - name: build
        run: corepack yarn build
